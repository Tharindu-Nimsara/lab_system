spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lab_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:tn24536}
  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema; Hibernate only checks it
    open-in-view: false
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: always
    timeout: 8h

server:
  port: 4000
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

app:
  lab:
    name: ${LAB_NAME:Medical Laboratory}
    address: ${LAB_ADDRESS:123 Main Street, Colombo}
    phone: ${LAB_PHONE:011-1234567}
  storage:
    reports-dir: ${REPORTS_DIR:./storage/reports}

management:
  endpoints:
    web:
      exposure:
        include: health
